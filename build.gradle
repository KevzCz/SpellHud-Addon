plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven { url 'https://maven.shedaniel.me/' }
	maven { url "https://jitpack.io" }
	flatDir {
		dirs 'lib'
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation("maven.modrinth:spell-engine:${project.spell_engine}")
	modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
    dryRun = gradle.startParameter.taskNames.any { it.contains("publishModsDry") }

    file = tasks.remapJar.archiveFile
    displayName = "SpellHud Addon [FABRIC] [${rootProject.minecraft_version}] - [${project.version}]"
    type = STABLE
    modLoaders.add("fabric")

    def changelogFile = rootProject.file("CHANGELOG.md")
    def changelogText = changelogFile.exists() ? changelogFile.text : ""
    changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText

    curseforge {
        projectId = "1264842"
        projectSlug = "spellhud-addon"
        accessToken = providers.gradleProperty("cfToken")
            .orElse(providers.environmentVariable("CF_TOKEN"))
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = false
    }

    modrinth {
        projectId = "pKnYeM6R"
        accessToken = providers.gradleProperty("modrinthToken")
            .orElse(providers.environmentVariable("MODRINTH_TOKEN"))
        minecraftVersions.add("1.21.1")
        environment = CLIENT_ONLY
    }
}

tasks.register("publishModsDry", Copy) {
    group = "upload"
    description = "Dry run of publishMods - writes to build/unified-dry/ instead of uploading."

    def publishTasks = tasks.withType(me.modmuss50.mpp.PublishModTask)
    dependsOn publishTasks

    from(publishTasks.collect { it.dryRunDirectory }) {
        include "**/*.jar"
    }
    into rootProject.layout.buildDirectory.dir("unified-dry")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named("publishMods") { group = "upload" }
tasks.withType(me.modmuss50.mpp.PublishModTask).configureEach {
    group = "upload"
}
